insight_title: "Reflexividade como condição de inteligibilidade socioecológica"
insight_summary: |
  A dificuldade em articular o papel das Humanidades na ecologia computacional
  não decorre de falta de dados, mas de um regime de conhecimento que instrumentaliza
  o saber sem interrogar suas condições de possibilidade.

raw_intuition: |
  Estou pensando em como os sistemas computacionais de ecologia sempre partem do 
  pressuposto de que o conhecimento sobre o território é dado. Mas quem define o 
  que conta como dado? E por quê certas formas de saber (indígenas, locais, 
  narrativas) ficam de fora? Acho que o problema não é a falta de dados, é a 
  moldura epistemológica que os seleciona. Isso tem a ver com Humanidades de um 
  jeito que ainda não consigo articular bem.

